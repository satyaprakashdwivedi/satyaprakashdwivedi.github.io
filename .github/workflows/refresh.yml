name: refresh projects
on:
  schedule:
    - cron: "30 2 * * *"      # daily at 08:00 IST
  workflow_dispatch:
  push:
    paths: ["site/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python site/build_site.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if the page changed
        run: |
          if git diff --quiet index.html; then echo "no changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh active projects" && git push
